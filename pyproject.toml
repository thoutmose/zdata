[project]
name = "zevent-dataviz"
version = "0.1.0"
description = "Data visualization and data-modeling dashboards for ZEvent, built with Streamlit."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.12.0",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]

# `app` must be an installed (editable) package, not just a directory on disk:
# `streamlit run app/🏠_Home.py` runs as its own subprocess and puts app/'s own
# directory on sys.path, not the project root, so `import app.core...` only
# resolves if `app` is importable via site-packages regardless of cwd/entry
# script — exactly like `streamlit`, `pandas`, etc. already are.
[tool.uv]
# This app only ever runs on Linux (dev machine and the Postgres warehouse
# server are both Linux) — without this, `uv add` tries to resolve a lockfile
# that also satisfies win32, which fails as soon as a dependency (e.g. a
# CPU-only PyTorch build) isn't published for every platform.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# Only torch needs the CPU-only wheel index (its default PyPI build pulls in
# CUDA/GPU packages this app has no use for on a server with no GPU) — every
# other dependency still resolves from PyPI as normal.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "D",   # pydocstyle (Google convention)
]
ignore = [
    "D203", # conflicts with D211 (Google convention picks D211)
    "D213", # conflicts with D212 (Google convention picks D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # tests don't need docstrings on every function
"app/core/translations.py" = ["E501"] # translation strings shouldn't be hand-wrapped

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
